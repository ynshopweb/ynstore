<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YN SHOP - Skincare & Kosmetik Original | Store Pick Up</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Admin Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS (dipisah ke file sendiri) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full flex flex-col text-slate-800 antialiased selection:bg-brand-500 selection:text-white bg-slate-50">

    <!-- Toast Notification Overlay -->
    <div id="toast-container"></div>



    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col">

        <!-- CUSTOMER HEADER & NAVBAR (partials/header.html) -->
        <div data-slot="partials/header.html"></div>

        <!-- CUSTOMER VIEWS WRAPPER -->
        <main id="customer-main-view" class="flex-1">
            <div data-slot="partials/home.html"></div>
            <div data-slot="partials/products.html"></div>
            <div data-slot="partials/promo.html"></div>
            <div data-slot="partials/how-to-order.html"></div>
            <div data-slot="partials/about.html"></div>
            <div data-slot="partials/checkout.html"></div>
            <div data-slot="partials/payment.html"></div>
            <div data-slot="partials/customer-profile.html"></div>
            <div data-slot="partials/order-tracker.html"></div>
        </main>

        <!-- ADMIN MAIN PANEL VIEW (partials/admin.html) -->
        <div data-slot="partials/admin.html"></div>

        <!-- FOOTER (partials/footer.html) -->
        <div data-slot="partials/footer.html"></div>

    </div>

    <!-- SLIDE-OVER CART DRAWER (partials/cart-drawer.html) -->
    <div data-slot="partials/cart-drawer.html"></div>

    <!-- AUTH MODAL - Login / Register (partials/auth-modal.html) -->
    <div data-slot="partials/auth-modal.html"></div>

    <!-- PRODUCT DETAIL MODAL (partials/product-detail-modal.html) -->
    <div data-slot="partials/product-detail-modal.html"></div>

    <!-- APLIKASI: Firebase config + seluruh modul JS (lihat folder /js) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
