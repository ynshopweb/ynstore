            <section id="view-checkout" class="view-page hidden animate-fadeIn max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                <div>
                    <h1 class="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-cart-flatbed text-brand-600"></i> Checkout & Slot Store Pick Up
                    </h1>
                    <p class="text-xs text-slate-500">Lengkapi data pembeli dan tentukan jadwal pengambilan barang di toko.</p>
                </div>

                <form id="checkout-form" onsubmit="handleCheckoutSubmit(event)" class="grid lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                            <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
                                <i class="fa-solid fa-user-pen text-brand-600"></i> 1. Informasi Pemesan
                            </h3>
                            <div class="grid sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap <span class="text-rose-500">*</span></label>
                                    <input type="text" id="checkout-name" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500 font-medium">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor WhatsApp <span class="text-rose-500">*</span></label>
                                    <input type="tel" id="checkout-phone" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500 font-medium">
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email <span class="text-slate-400 font-normal">(Opsional)</span></label>
                                    <input type="email" id="checkout-email" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500 font-medium">
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                            <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
                                <i class="fa-solid fa-clock text-brand-600"></i> 2. Jadwal Store Pick Up
                            </h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Pilih Tanggal Pengambilan <span class="text-rose-500">*</span></label>
                                    <input type="date" id="checkout-pickup-date" required onchange="renderTimeSlots()" class="w-full sm:w-64 bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500 font-medium">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Pilih Jam Pengambilan <span class="text-rose-500">*</span></label>
                                    <div id="time-slots-container" class="grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
                                    <input type="hidden" id="checkout-selected-slot" required>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Catatan untuk Toko</label>
                                    <textarea id="checkout-notes" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500 font-medium" placeholder="Contoh: Packing kado / Ambil jam 5 sore."></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="bg-rose-50/60 p-4 rounded-xl border border-rose-100 flex items-start gap-3">
                            <input type="checkbox" id="checkout-confirm-check" required class="mt-1 accent-brand-600 w-4 h-4 cursor-pointer">
                            <label for="checkout-confirm-check" class="text-xs text-slate-700 cursor-pointer">
                                <strong>Saya memastikan data pesanan & jadwal pick up sudah benar.</strong> Saya bersedia upload bukti transfer QRIS DANA.
                            </label>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4 sticky top-[110px]">
                            <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-3">Ringkasan Pesanan</h3>
                            <div id="checkout-summary-items" class="space-y-3 max-h-60 overflow-y-auto pr-1"></div>

                            <div class="border-t border-slate-100 pt-3 space-y-2 text-xs">
                                <div class="flex justify-between text-slate-600">
                                    <span>Subtotal</span>
                                    <span id="checkout-subtotal">Rp 0</span>
                                </div>
                                <div class="flex justify-between text-slate-600">
                                    <span>Ambil di Toko</span>
                                    <span class="text-emerald-600 font-bold">GRATIS</span>
                                </div>
                                <div class="border-t border-slate-100 pt-2 flex justify-between font-extrabold text-sm text-slate-900">
                                    <span>Total Tagihan</span>
                                    <span id="checkout-total-price" class="text-brand-600">Rp 0</span>
                                </div>
                            </div>

                            <button type="submit" id="btn-submit-checkout" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-qrcode"></i> Lanjut Pembayaran QRIS
                            </button>
                        </div>
                    </div>
                </form>
            </section>
