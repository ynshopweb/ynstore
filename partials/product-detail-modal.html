<!-- MODAL DETAIL PRODUK YN SHOP -->
<div id="product-detail-modal" 
     class="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 md:p-6 transition-all duration-300 opacity-0 pointer-events-none"
     role="dialog"
     aria-modal="true"
     aria-labelledby="modal-product-title"
     onclick="if(event.target === this){ window.closeProductDetailModal(); }">

    <!-- Modal Card Container -->
    <div id="product-modal-card" 
         class="relative bg-white w-full max-w-4xl h-[92vh] sm:h-auto sm:max-h-[88vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden transform translate-y-8 sm:translate-y-0 sm:scale-95 transition-all duration-300 border border-slate-100">

        <!-- STICKY HEADER NAVIGATION BAR -->
        <div class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-4 sm:px-6 py-3.5 border-b border-slate-100 flex items-center justify-between gap-3 shadow-sm transition-all">
            <!-- Tombol Kembali (Top Left) -->
            <button id="close-product-modal-back" 
                    onclick="closeProductDetailModal()" 
                    type="button" 
                    class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-brand-600 text-xs sm:text-sm font-bold flex items-center gap-2 transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
                    aria-label="Kembali ke halaman sebelumnya">
                <i class="fa-solid fa-arrow-left text-base"></i>
                <span class="hidden sm:inline">Kembali</span>
            </button>

            <!-- Sticky Title (Tampil saat scrolled) -->
            <div id="modal-header-product-title" class="flex-1 text-center px-2 truncate transition-opacity duration-200 opacity-90">
                <p class="text-xs sm:text-sm font-bold text-slate-800 truncate" id="modal-sticky-title-text">Detail Produk</p>
            </div>

            <!-- Tombol Tutup / X (Top Right) -->
            <button id="close-product-modal-x" 
                    onclick="closeProductDetailModal()" 
                    type="button" 
                    class="w-10 h-10 rounded-full bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-brand-600 flex items-center justify-center transition-all duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
                    aria-label="Tutup modal detail produk">
                <i class="fa-solid fa-xmark text-xl sm:text-2xl"></i>
            </button>
        </div>

        <!-- SCROLLABLE BODY CONTENT -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 space-y-6 custom-scrollbar" id="product-modal-scrollable">
            <div class="grid md:grid-cols-2 gap-6 md:gap-8 items-start">
                
                <!-- Gambar Produk Utama & Badge -->
                <div class="space-y-3">
                    <div class="relative bg-slate-50 rounded-2xl overflow-hidden border border-slate-100 shadow-inner group">
                        <span class="absolute top-3 left-3 z-10 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-white/90 text-brand-600 backdrop-blur-md shadow-sm border border-rose-100">
                            <i class="fa-solid fa-certificate text-amber-400"></i> 100% Original & BPOM
                        </span>
                        <img id="modal-product-image" 
                             src="https://placehold.co/600x600/fff1f2/e11d48?text=YN+Shop" 
                             alt="Gambar Produk" 
                             class="w-full h-72 sm:h-80 md:h-96 object-cover object-center group-hover:scale-105 transition-transform duration-500"
                             onerror="this.src='https://placehold.co/600x600/fff1f2/e11d48?text=YN+Shop'">
                    </div>
                </div>

                <!-- Informasi Rincian Produk -->
                <div class="space-y-5 flex flex-col justify-between">
                    <div>
                        <!-- Category Badge & Ratings -->
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <span id="modal-product-category" class="px-3 py-1 rounded-lg bg-rose-50 text-brand-600 text-xs font-bold uppercase tracking-wider">
                                Skincare
                            </span>
                            <div class="flex items-center gap-1 text-amber-400 text-xs font-bold">
                                <i class="fa-solid fa-star"></i>
                                <span id="modal-product-rating" class="text-slate-700">4.9</span>
                                <span id="modal-product-sales" class="text-slate-400 font-normal">(120+ terjual)</span>
                            </div>
                        </div>

                        <!-- Judul Produk -->
                        <h2 id="modal-product-title" class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">
                            Nama Produk YN Shop
                        </h2>

                        <!-- Badge Promo -->
                        <span id="modal-promo-badge" class="hidden mt-2 inline-flex items-center gap-1 bg-gradient-to-r from-amber-500 to-rose-600 text-white text-[10px] font-black px-2.5 py-1 rounded-full uppercase shadow pulse-badge w-fit">
                            PROMO
                        </span>

                        <!-- Harga Produk -->
                        <div class="mt-3 flex items-baseline gap-3 flex-wrap">
                            <span id="modal-product-price" class="text-2xl sm:text-3xl font-extrabold text-brand-600">
                                Rp 0
                            </span>
                            <span id="modal-product-original-price" class="hidden text-sm text-slate-400 line-through font-semibold">
                                Rp 0
                            </span>
                            <span id="modal-product-stock-badge" class="text-xs text-emerald-600 font-bold bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200/60">
                                <i class="fa-solid fa-check me-1"></i> Stok Tersedia
                            </span>
                        </div>

                        <!-- Countdown Promo -->
                        <div id="modal-promo-countdown-wrap" class="hidden mt-2 inline-flex items-center gap-1.5 text-xs text-rose-600 font-bold bg-rose-50 px-2.5 py-1 rounded-full border border-rose-100 w-fit">
                            <i class="fa-regular fa-clock"></i>
                            <span>Berakhir dalam</span>
                            <span id="modal-promo-countdown">-</span>
                        </div>

                        <!-- Divider -->
                        <hr class="my-4 border-slate-100">

                        <!-- Deskripsi Produk -->
                        <div class="space-y-2">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Deskripsi & Keunggulan</h3>
                            <div id="modal-product-description" class="text-slate-600 text-xs sm:text-sm leading-relaxed whitespace-pre-line bg-slate-50 p-4 rounded-2xl border border-slate-100/80">
                                Deskripsi lengkap produk akan ditampilkan di sini.
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons Desktop & Tablet -->
                    <div class="pt-4 space-y-3 border-t border-slate-100">
                        <div id="modal-qty-selector" class="flex items-center gap-3">
                            <label for="modal-product-qty" class="text-xs font-bold text-slate-700">Jumlah:</label>
                            <div class="flex items-center border border-slate-200 rounded-xl overflow-hidden bg-slate-50">
                                <button type="button" 
                                        onclick="adjustModalQty(-1)" 
                                        class="w-9 h-9 flex items-center justify-center text-slate-600 hover:bg-slate-200 font-bold transition">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                <input type="number" 
                                       id="modal-product-qty" 
                                       value="1" 
                                       min="1" 
                                       max="99" 
                                       class="w-12 text-center text-xs font-bold bg-transparent border-0 focus:ring-0 text-slate-900"
                                       readonly>
                                <button type="button" 
                                        onclick="adjustModalQty(1)" 
                                        class="w-9 h-9 flex items-center justify-center text-slate-600 hover:bg-slate-200 font-bold transition">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                            <button id="modal-add-to-cart-btn" 
                                    type="button"
                                    class="w-full py-3.5 px-5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs sm:text-sm shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 transition-all active:scale-95 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-bag-shopping"></i>
                                <span>+ Keranjang</span>
                            </button>
                            <a id="modal-whatsapp-btn" 
                               href="https://wa.me/6281910621676" 
                               target="_blank" 
                               rel="noopener noreferrer"
                               class="w-full py-3.5 px-5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm shadow-lg shadow-emerald-600/20 transition-all active:scale-95 flex items-center justify-center gap-2">
                                <i class="fa-brands fa-whatsapp text-lg"></i>
                                <span>Tanya via WA</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
