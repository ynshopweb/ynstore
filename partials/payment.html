            <section id="view-payment" class="view-page hidden animate-fadeIn max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                <div class="text-center space-y-1">
                    <span class="bg-amber-100 text-amber-800 text-[11px] font-bold px-3 py-1 rounded-full"><i class="fa-solid fa-hourglass-half me-1"></i> Menunggu Pembayaran</span>
                    <h1 class="text-2xl font-extrabold text-slate-900">Pembayaran QRIS DANA YN Shop</h1>
                </div>

                <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-md space-y-6">
                    <div class="bg-slate-50 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-2 text-xs border border-slate-100">
                        <div>
                            <p class="text-slate-400">Nomor Pesanan</p>
                            <p id="pay-order-number" class="font-bold text-slate-900 font-mono text-sm">-</p>
                        </div>
                        <div class="text-right">
                            <p class="text-slate-400">Total Pembayaran</p>
                            <p id="pay-total-amount" class="font-black text-brand-600 text-base">Rp 0</p>
                        </div>
                    </div>

                    <div class="flex flex-col items-center justify-center space-y-3 py-2">
                        <div class="p-4 bg-white border-2 border-slate-900 rounded-2xl shadow-md text-center max-w-xs w-full">
                            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                                <span class="font-black text-slate-900 text-xs">QRIS</span>
                                <span id="payment-qris-provider" class="text-[10px] font-bold text-slate-500">DANA</span>
                            </div>
                            <div class="bg-white p-2 rounded-lg flex items-center justify-center min-h-[192px]">
                                <img id="payment-qris-image" src="" alt="QRIS Pembayaran" class="hidden w-48 h-48 mx-auto object-contain">
                                <div id="payment-qris-placeholder" class="text-slate-400 text-xs py-10 px-4">
                                    <i class="fa-solid fa-qrcode text-3xl mb-2"></i>
                                    <p>QRIS belum diatur oleh admin.</p>
                                </div>
                            </div>
                            <p class="text-[11px] font-bold text-slate-700 mt-2">a.n. <span id="payment-qris-owner">YN SHOP</span></p>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-4 space-y-3">
                        <label class="block text-xs font-bold text-slate-900">Upload Foto Bukti Transfer / Pembayaran <span class="text-rose-500">*</span></label>
                        <div class="flex items-center justify-center w-full">
                            <label for="proof-file-input" class="flex flex-col items-center justify-center w-full h-36 border-2 border-slate-300 border-dashed rounded-2xl cursor-pointer bg-slate-50 hover:bg-rose-50/40 hover:border-brand-500 transition relative overflow-hidden">
                                <div id="upload-placeholder" class="flex flex-col items-center justify-center p-4">
                                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-brand-600 mb-1"></i>
                                    <p class="text-xs text-slate-600 font-semibold">Klik untuk memilih foto screenshot bukti</p>
                                    <p class="text-[10px] text-slate-400">JPG, PNG, WEBP (Maks 5MB)</p>
                                </div>
                                <img id="upload-preview-img" src="" class="hidden absolute inset-0 w-full h-full object-contain p-2 bg-white">
                                <input id="proof-file-input" type="file" accept="image/*" class="hidden" onchange="handleProofFileChange(this)">
                            </label>
                        </div>

                        <button onclick="submitPaymentProof()" id="btn-submit-proof" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> Kirim Bukti Pembayaran Ke Admin
                        </button>
                    </div>
                </div>
            </section>
