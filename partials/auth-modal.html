    <div id="auth-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden relative animate-fadeIn">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            
            <div class="p-6">
                <!-- Tabs -->
                <div class="flex border-b border-slate-100 mb-6 font-bold text-sm">
                    <button onclick="switchAuthTab('login')" id="auth-tab-btn-login" class="flex-1 pb-2 border-b-2 border-brand-600 text-brand-600">Masuk</button>
                    <button onclick="switchAuthTab('register')" id="auth-tab-btn-register" class="flex-1 pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600">Daftar Akun</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="modal-login-form" onsubmit="handleAuthLogin(event)" class="space-y-4">
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 text-[11px] text-blue-800 space-y-1">
                        <p class="font-bold"><i class="fa-solid fa-circle-info me-1"></i> Info Login Quick Access:</p>
                        <p>Gunakan email akhiran <span class="font-semibold">@admin.com</span> untuk tes masuk sebagai Admin.</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                        <input type="email" id="auth-login-email" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500" placeholder="nama@email.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                        <input type="password" id="auth-login-password" required minlength="6" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500" placeholder="••••••••">
                    </div>
                    <button type="submit" id="btn-auth-login" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-lg shadow transition flex items-center justify-center">
                        <span id="btn-auth-login-text">Masuk Sekarang</span>
                        <div id="btn-auth-login-spinner" class="spinner hidden ms-2"></div>
                    </button>
                </form>

                <!-- REGISTER FORM -->
                <form id="modal-register-form" onsubmit="handleAuthRegister(event)" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                        <input type="text" id="auth-reg-name" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500" placeholder="Nama Anda">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor WhatsApp</label>
                        <input type="tel" id="auth-reg-phone" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500" placeholder="081234567890">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                        <input type="email" id="auth-reg-email" required class="w-full border border-slate-300 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500" placeholder="nama@email.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Password (Min 6 Karakter)</label>
                        <input type="password" id="auth-reg-password" required minlength="6" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs outline-none focus:border-brand-500" placeholder="••••••••">
                    </div>
                    <button type="submit" id="btn-auth-reg" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-lg shadow transition flex items-center justify-center">
                        <span id="btn-auth-reg-text">Daftar Akun Baru</span>
                        <div id="btn-auth-reg-spinner" class="spinner hidden ms-2"></div>
                    </button>
                </form>
            </div>
        </div>
    </div>
